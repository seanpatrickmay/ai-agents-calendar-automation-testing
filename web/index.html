<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calendar Lab</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head>
<body><header><div><p class="eyebrow">LOCAL · SYNTHETIC DATA ONLY</p><h1>Calendar Lab</h1><p>A small calendar, saved on this computer. All times are UTC.</p></div><button id="add">+ Add event</button></header>
<main><section aria-label="Month calendar"><nav><div><button id="prev" aria-label="Previous month">←</button><button id="today">Today</button><button id="next" aria-label="Next month">→</button></div><h2 id="month"></h2><button id="refresh">Refresh</button></nav><p id="status" role="status"></p><div id="weekdays" aria-hidden="true"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div><div id="calendar"></div></section><aside><p class="eyebrow">SELECTED DAY</p><h2 id="selected"></h2><div id="agenda"></div><p class="hint">Select a day to explore. Select an event to edit it. Refresh to see API changes.</p></aside></main>
<dialog id="editor"><form id="form"><div class="dialog-head"><h2 id="form-title">Add event</h2><button type="button" id="cancel" aria-label="Close editor">×</button></div><label>Title<input id="title" required maxlength="200" autocomplete="off"></label><div class="times"><label>Starts (UTC)<input id="start" type="datetime-local" required step="1"></label><label>Ends (UTC)<input id="end" type="datetime-local" required step="1"></label></div><label>Location<input id="location" maxlength="500"></label><label>Notes<textarea id="notes" rows="3" maxlength="10000"></textarea></label><p id="form-error" role="alert"></p><footer><button type="button" id="delete" class="danger">Delete event</button><button type="submit" id="save">Save event</button></footer></form></dialog></body></html>
